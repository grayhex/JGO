# MGO in Docker: the main way to run it (NAS: Synology, UGREEN, QNAP, TrueNAS; any Linux host).
#
#   1. paste this YAML into NAS/Portainer or save it as compose.yaml
#   2. edit the game library path below, then Deploy / docker compose up -d
#   3. open https://<NAS IP>:8443 and sign in with the token from app container logs
# Set MGO_TLS_SAN for your NAS IP/DNS before the first start, or mount a trusted
# certificate pair with MGO_TLS_CERTS (docs/HTTPS.md). The generated local
# certificate needs explicit client trust.
# No manual token needed. The credential lives in the private mgo-auth volume.
#
# Java ME (.jar/.jad) works out of the box. Symbian / N-Gage (.sis/.sisx/.n-gage) run in the second service, mgo-symbian
# (EKA2L1): it is part of this file, nothing to switch on. It needs YOUR firmware: Settings -> Symbian -> "Firmware archive".
# No Symbian games? Delete the whole mgo-symbian block (and SYMBIAN_* lines in app): MGO works exactly as before.
#
# Variables (all optional, via .env): MGO_TOKEN, MGO_VERSION, MGO_BIND, MGO_PORT, MGO_DATA, MGO_LIBRARY.
#
# Details, NAS walkthroughs, updates and backups: docs/DOCKER.md
# Source builds use the separate compose.build.yaml override; this file needs NO local source tree.
#
# Before upgrading a renamed installation, point MGO_DATA and the firmware volume
# at your existing data; the application data format has not changed.
name: mgo

services:
  app:
    image: ghcr.io/grayhex/mgo:${MGO_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      # Optional override: MGO_TOKEN still works. Empty = auto-generate once in mgo-auth.
      TRUST_PROXY: "1"
      AAS_PROXY_URL: http://gateway:9090
      LIBRARY_ROOTS: /mnt/mgo-library /mnt/mgo-java /mnt/mgo-ngage /mnt/mgo-sis
      AUTH_TOKEN: ${MGO_TOKEN:-}
      MGO_AUTH_DIR: /mgo-auth
      # The app listens on the private compose network only; the gateway below publishes it.
      MAX_SESSIONS: ${MAX_SESSIONS:-1}
      SESSION_MAX_MINUTES: ${SESSION_MAX_MINUTES:-120}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-5}
      LIBRARY_QUOTA_MB: ${LIBRARY_QUOTA_MB:-4096}
      FRAME_ENCODING: ${FRAME_ENCODING:-deflate}
      KEM_CPU_SECONDS: ${KEM_CPU_SECONDS:-0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MOBYGAMES_API_KEY: ${MOBYGAMES_API_KEY:-}
      # Symbian / N-Gage service. The shared secret is generated by mgo-symbian into the symbian-auth volume (read-only here).
      SYMBIAN_AGENT_URL: http://mgo-symbian:8766
      SYMBIAN_AGENT_TOKEN_FILE: /symbian-auth/agent-token
      MAX_SYMBIAN_PACKAGE_MB: ${MAX_SYMBIAN_PACKAGE_MB:-512}
      MAX_FIRMWARE_MB: ${MAX_FIRMWARE_MB:-2048}
    volumes:
      # MGO_DATA defaults to a persistent Docker volume. To use a NAS folder instead,
      # replace the left-hand side with /volume1/docker/mgo/data and adjust PUID/PGID.
      # Never delete /data during upgrades: it contains saves and settings.
      - ${MGO_DATA:-mgo-data}:/data
      # Private Docker-managed credentials volume, independent of NAS folder ACLs.
      # Do not mount this from a NAS shared folder or delete it on upgrade.
      - mgo-auth:/mgo-auth
      - symbian-auth:/symbian-auth:ro
      # EDIT THE LEFT-HAND PATH for your NAS: e.g. /volume1/games/j2me:/mnt/mgo-library:ro
      # The default ./games is relative to this compose project; MGO only reads it.
      # After deployment select /mnt/mgo-library in Settings > Game library.
      - ${MGO_LIBRARY:-./games}:/mnt/mgo-library:ro
      - ${MGO_JAVA_LIBRARY:-./games/java}:/mnt/mgo-java:ro
      - ${MGO_NGAGE_LIBRARY:-./games/ngage}:/mnt/mgo-ngage:ro
      - ${MGO_SIS_LIBRARY:-./games/sis}:/mnt/mgo-sis:ro
    networks: [internal, symbian]
    # --- hardening: the JAR is untrusted code ---
    # If /data is a NAS bind-mounted directory, grant this UID:GID write access
    # or set user to the owner of that NAS folder (e.g. "1000:10").
    # With the Docker-managed mgo-data volume, keep the default 10001:10001.
    user: "${PUID:-10001}:${PGID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: ${MEM_LIMIT:-1536m}
    cpus: ${CPUS:-2}
    shm_size: 256m
    tmpfs:
      - /tmp:size=128m,mode=1777,exec

  gateway:
    image: ghcr.io/grayhex/mgo-gateway:${MGO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # To change the port directly, replace the complete value with "8090:8080".
      # MGO_BIND=127.0.0.1 confines access to the host (for HTTPS reverse proxy).
      - "${MGO_BIND:-0.0.0.0}:${MGO_PORT:-8080}:8080"
      - "${MGO_BIND:-0.0.0.0}:${MGO_HTTPS_PORT:-8443}:8443"
    environment:
      MGO_HTTPS_PORT: ${MGO_HTTPS_PORT:-8443}
      MGO_TLS_SAN: ${MGO_TLS_SAN:-DNS:localhost,IP:127.0.0.1}
    volumes:
      - ${MGO_TLS_CERTS:-mgo-tls}:/certs
    networks: [internal, edge]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    tmpfs: [/var/cache/nginx, /var/run, /tmp, /etc/nginx/conf.d]

  # Symbian S60 / N-Gage through EKA2L1. Nothing proprietary is in the image: you add your own firmware in MGO.
  # Only the app can reach it (network `symbian` has no route out), so a game cannot reach the internet or your LAN.
  mgo-symbian:
    image: ghcr.io/grayhex/mgo-symbian:${MGO_SYMBIAN_VERSION:-edge}
    restart: unless-stopped
    init: false # the image has its own init (tini)
    environment:
      AGENT_TOKEN_FILE: /symbian-auth/agent-token # created on the first start and shared with the app; no token to type in
      MAX_FIRMWARE_BYTES: ${SYMBIAN_MAX_FIRMWARE_BYTES:-2147483648}
      MAX_PACKAGE_BYTES: ${SYMBIAN_MAX_PACKAGE_BYTES:-536870912}
      MAX_INSTANCE_SECONDS: ${SYMBIAN_MAX_INSTANCE_SECONDS:-7200}
    volumes:
      # firmware (the emulator's base directory), per-game saves, the device list: keep it, it holds your firmware
      - mgo-symbian-data:/data
      - symbian-auth:/symbian-auth
      # Optional inbox: firmware too big for the browser / your reverse proxy. Put the archive in this folder on the host and
      # install it from Settings -> Symbian -> "Firmware from a folder". Read-only: MGO never changes or deletes these files.
      - ${SYMBIAN_INBOX:-./symbian-inbox}:/inbox:ro
    networks: [symbian]
    read_only: true
    tmpfs:
      - /tmp:size=512m
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # one emulator at a time; software OpenGL (llvmpipe) is CPU-heavy, so cap it
    cpus: ${SYMBIAN_CPUS:-2}
    mem_limit: ${SYMBIAN_MEMORY:-3g}
    pids_limit: 512

networks:
  # no route out: games cannot reach the internet or your LAN. See compose.egress.yaml to allow it.
  internal:
    internal: true
  edge: {}
  # app <-> mgo-symbian only, no route out
  symbian:
    internal: true

volumes:
  mgo-tls:
  mgo-data:
  mgo-auth:
  mgo-symbian-data:
  symbian-auth:
