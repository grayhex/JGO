# JGO in Docker: the main way to run it (NAS: Synology, UGREEN, QNAP, TrueNAS; any Linux host).
#
#   1. paste this YAML into NAS/Portainer or save it as compose.yaml
#   2. edit the game library path below, then Deploy / docker compose up -d
#   3. open http://<NAS IP>:8080 and sign in with the token from app container logs
# No .env or manual token needed. The credential lives in the private jgo-auth volume.
# Optional: set JGO_TOKEN / JGO_VERSION / other variables using .env for advanced deployments.
#
# Details, NAS walkthroughs, updates and backups: docs/DOCKER.md
# Source builds use the separate compose.build.yaml override; this file needs NO local source tree.
name: jgo

services:
  app:
    image: ghcr.io/grayhex/jgo:${JGO_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      # Optional override: an existing JGO_TOKEN still works. Empty = auto-generate once in /data.
      AUTH_TOKEN: ${JGO_TOKEN:-}
      JGO_AUTH_DIR: /jgo-auth
      # The app listens on the private compose network only; the gateway below publishes it.
      MAX_SESSIONS: ${MAX_SESSIONS:-1}
      SESSION_MAX_MINUTES: ${SESSION_MAX_MINUTES:-120}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-5}
      LIBRARY_QUOTA_MB: ${LIBRARY_QUOTA_MB:-4096}
      FRAME_ENCODING: ${FRAME_ENCODING:-deflate}
      KEM_CPU_SECONDS: ${KEM_CPU_SECONDS:-0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MOBYGAMES_API_KEY: ${MOBYGAMES_API_KEY:-}
    volumes:
      # JGO_DATA defaults to a persistent Docker volume. To use a NAS folder instead,
      # replace the left-hand side with /volume1/docker/jgo/data and adjust PUID/PGID.
      # Never delete /data during upgrades: it contains saves and settings.
      - ${JGO_DATA:-jgo-data}:/data
      # Private Docker-managed credentials volume, independent of NAS folder ACLs.
      # Do not mount this from a NAS shared folder or delete it on upgrade.
      - jgo-auth:/jgo-auth
      # EDIT THE LEFT-HAND PATH for your NAS: e.g. /volume1/games/j2me:/mnt/jgo-library:ro
      # The default ./games is relative to this compose project; JGO only reads it.
      # After deployment select /mnt/jgo-library in Settings > Game library.
      - ${JGO_LIBRARY:-./games}:/mnt/jgo-library:ro
    networks: [internal]
    # --- hardening: the JAR is untrusted code ---
    # If /data is a NAS bind-mounted directory, grant this UID:GID write access
    # or set user to the owner of that NAS folder (e.g. "1000:10").
    # With the Docker-managed jgo-data volume, keep the default 10001:10001.
    user: "${PUID:-10001}:${PGID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: ${MEM_LIMIT:-1536m}
    cpus: ${CPUS:-2}
    shm_size: 256m
    tmpfs:
      - /tmp:size=128m,mode=1777,exec

  gateway:
    image: ghcr.io/grayhex/jgo-gateway:${JGO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # To change the port directly, replace the complete value with "8090:8080".
      # JGO_BIND=127.0.0.1 confines access to the host (for HTTPS reverse proxy).
      - "${JGO_BIND:-0.0.0.0}:${JGO_PORT:-8080}:8080"
    networks: [internal, edge]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    tmpfs: [/var/cache/nginx, /var/run, /tmp]

networks:
  # no route out: games cannot reach the internet or your LAN. See compose.egress.yaml to allow it.
  internal:
    internal: true
  edge: {}

volumes:
  jgo-data:
  jgo-auth:
