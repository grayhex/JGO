name: Bug report
description: A game does not start, looks wrong, or JGO misbehaves
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the beta. Please do not attach commercial game files; the game's name and version are enough.
  - type: input
    id: version
    attributes:
      label: JGO version
      description: Shown in the sidebar of the web UI, or the image tag
      placeholder: 0.1.0-beta.1
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options: [Docker on Synology, Docker on UGREEN, Docker on another NAS, Docker on a Linux server, Proxmox VE (LXC), From source]
    validations: { required: true }
  - type: input
    id: hardware
    attributes:
      label: Device / CPU / RAM
      placeholder: "Synology DS923+, Ryzen R1600, 8 GB"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: game
    attributes:
      label: Game
      description: Name, version, vendor; the phone model and resolution you chose
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics
      description: In the player, Session → Download diagnostics, then paste the text (it holds the settings, the emulator log and JVM state, no token)
      render: text
