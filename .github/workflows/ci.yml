name: CI

# One run per change: a push to main, or a pull request (a branch with a PR used to run twice, on `push` and on `pull_request`).
# A branch without a PR is not tested until one is opened (or run this workflow by hand).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned in runtime/scripts/build-kemulator.sh; used only for the cache key
  KEM_BUILD_INPUTS: runtime/patches runtime/audio runtime/scripts/build-kemulator.sh runtime/scripts/lib.sh

jobs:
  typescript:
    name: TypeScript (typecheck, build, unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node tests/scripts/production.mjs
      - name: Staged MGO release packaging
        run: node --test tests/scripts/release-prune.test.mjs
      - name: Unit tests (JAR parser, device presets, analyzer, skin geometry and hitbox parsing)
        run: npm test

  https:
    name: HTTPS gateway (TLS, redirect, WebSocket, streamed upload)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build -f runtime/Dockerfile --target gateway -t mgo-gateway:verify .
      - run: docker pull node:22-alpine
      - run: node tests/scripts/https-smoke.mjs

  phone-skins:
    name: Phone skins (asset validation)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - name: config.json, transparent windows, non-overlapping hitboxes, mappings
        run: python3 tools/phones/validate_assets.py

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridge/kemulator-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/kemulator-adapter/target
          key: cargo-${{ runner.os }}-${{ hashFiles('bridge/kemulator-adapter/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  scripts:
    name: Build scripts (shellcheck + compile errors must fail)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: shellcheck -S warning runtime/scripts/*.sh tests/fixtures/*/build.sh tests/scripts/*.sh tools/proxmox/*.sh
      - run: bash tests/scripts/build-scripts.test.sh
      - run: bash tests/scripts/library-mount.test.sh
      - run: bash tests/scripts/version-order.test.sh

  integration:
    name: Integration tests on the real KEmulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/kemulator-adapter/target
          key: cargo-int-${{ runner.os }}-${{ hashFiles('bridge/kemulator-adapter/Cargo.lock', 'bridge/kemulator-adapter/src/**') }}
          restore-keys: cargo-int-${{ runner.os }}-
      - name: Cache the patched KEmulator build
        id: kem
        uses: actions/cache@v4
        with:
          path: runtime/build/kemulator
          key: kemulator-${{ hashFiles('runtime/patches/*', 'runtime/audio/**', 'runtime/scripts/build-kemulator.sh', 'runtime/scripts/lib.sh') }}
      - name: System packages (X server + Mesa software GL, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 fontconfig fonts-dejavu-core libharfbuzz0b nginx-light
      - name: Build everything (KEmulator from the pinned commit + patches, adapter, web, fixtures)
        run: |
          [ -f runtime/build/kemulator/KEmulator.jar ] && echo "KEmulator restored from cache" || true
          npm ci
          bash runtime/scripts/setup.sh
      - name: Integration tests (real emulator, 2D + audio + devices + Bridge regressions + 3D)
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24 +extension GLX" \
            env KEM_DISPLAY="$DISPLAY" LIBGL_ALWAYS_SOFTWARE=1 npm run test:integration

  e2e:
    name: Browser e2e + compatibility lab on the real KEmulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/kemulator-adapter/target
          key: cargo-int-${{ runner.os }}-${{ hashFiles('bridge/kemulator-adapter/Cargo.lock', 'bridge/kemulator-adapter/src/**') }}
          restore-keys: cargo-int-${{ runner.os }}-
      - name: Cache the patched KEmulator build
        id: kem
        uses: actions/cache@v4
        with:
          path: runtime/build/kemulator
          key: kemulator-${{ hashFiles('runtime/patches/*', 'runtime/audio/**', 'runtime/scripts/build-kemulator.sh', 'runtime/scripts/lib.sh') }}
      - name: System packages (X server + Mesa software GL, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 fontconfig fonts-dejavu-core libharfbuzz0b nginx-light
      - name: Build everything (KEmulator from the pinned commit + patches, adapter, web, fixtures)
        run: |
          [ -f runtime/build/kemulator/KEmulator.jar ] && echo "KEmulator restored from cache" || true
          npm ci
          bash runtime/scripts/setup.sh
      - name: Install Chromium for the browser e2e test
        run: npx playwright install --with-deps chromium
      - name: Browser e2e (upload, play, keys, audio, phone skins, first-run wizard, library import, MobyGames stand-in)
        run: npm run test:e2e
      - name: Developer-only phone alignment tools
        run: npm run test:e2e:dev
      - name: Compatibility lab on the free fixtures
        run: |
          npm run lab -- run tests/fixtures/testmidlet/build tests/fixtures/testmidlet3d/build tests/fixtures/labgames/build \
            --out lab-out --measure 3 --title "CI lab run"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-report-and-screenshots
          path: |
            lab-out/report.html
            lab-out/results.json
            test-results/*.png
          if-no-files-found: ignore

  packaging:
    name: Community Scripts files (lint, shellcheck, DevScripts export)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends shellcheck >/dev/null
      - run: shellcheck -S warning packaging/bin/mgo packaging/build-release.sh packaging/devscripts/*.sh ct/mgo.sh install/mgo-install.sh tests/lxc/run.sh tools/proxmox/*.sh -e SC1090,SC1091,SC2154,SC2034
      - name: Rules of community-scripts/DevScripts that can be checked mechanically
        run: packaging/devscripts/lint.sh
      - name: The exported pull-request files pass the same lint
        run: packaging/devscripts/export.sh

  lxc-install:
    name: Install as in Proxmox (Debian 13 + systemd) - install, 2D/audio/M3G, sandbox, RMS, backup, update, rollback, migration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: kem
        with:
          path: runtime/build/kemulator
          key: kemulator-${{ hashFiles('runtime/patches/*', 'runtime/audio/**', 'runtime/scripts/build-kemulator.sh', 'runtime/scripts/lib.sh') }}
      - name: Build (KEmulator from the pinned commit + patches, adapter, web, fixtures)
        run: |
          npm ci
          bash runtime/scripts/setup.sh
      - name: Let the fake GitHub listen on 443 without root; allow user namespaces for the per-game network isolation
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
          # Ubuntu 24.04 runners forbid unprivileged user namespaces through AppArmor; a Proxmox kernel does not
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the scenarios (tests/lxc/run.sh)
        run: tests/lxc/run.sh
      - if: failure()
        run: tail -n 80 .lxc-test/fake.log || true

  docker:
    name: Docker image + container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MGO_TOKEN: ci-token-0123456789abcdef
      CURL_CA_BUNDLE: ${{ github.workspace }}/work/ci-ca.crt
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/work/ci-ca.crt
      BASE: https://localhost:8443
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Published Compose must work without a source tree or local build
        run: |
          docker compose config --format json | python3 -c 'import json,sys; c=json.load(sys.stdin); assert set(c["services"]) == {"app", "gateway", "mgo-symbian"}; assert all("build" not in s for s in c["services"].values()); assert all(s.get("image", "").startswith("ghcr.io/grayhex/mgo") for s in c["services"].values())'
      - name: Build and start the stack
        # mgo-symbian compiles EKA2L1 (30-60 min): it is built by symbian.yml, not here
        run: |
          docker compose -f compose.yaml -f compose.build.yaml up -d --build app gateway
          mkdir -p work
          for i in $(seq 1 60); do docker compose cp gateway:/certs/server.crt work/ci-ca.crt && break; sleep 1; done
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do curl -fsS https://localhost:8443/api/health | grep -q '"ok":true' && exit 0; sleep 2; done
          docker compose logs app; exit 1
      - name: Build fixtures against the emulator jar from the image
        run: |
          mkdir -p runtime/build/kemulator
          docker compose cp app:/opt/kemulator/KEmulator.jar runtime/build/kemulator/KEmulator.jar
          bash tests/fixtures/testmidlet/build.sh runtime/build/kemulator/KEmulator.jar
          bash tests/fixtures/testmidlet3d/build.sh runtime/build/kemulator/KEmulator.jar
          bash tests/fixtures/labgames/build.sh runtime/build/kemulator/KEmulator.jar
      - name: Container smoke (2D + audio, M3G on llvmpipe)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          TOKEN=ci-token-0123456789abcdef node tests/e2e/container-smoke.mjs
      - name: Hardening is in effect
        run: |
          docker compose exec -T app sh -c 'test "$(id -u)" = 10001 && ! touch /x 2>/dev/null && grep -q "CapEff:.0000000000000000" /proc/self/status'
          ! docker compose exec -T app node -e "require('net').connect(80,'1.1.1.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      - name: The web UI wants the token
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' https://localhost:8443/api/games)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-token-0123456789abcdef' https://localhost:8443/api/games)" = 200
      - name: One-file Compose accepts missing .env / MGO_TOKEN
        run: |
          test ! -f .env
          env -u MGO_TOKEN docker compose config --format json | python3 -c 'import json,sys; c=json.load(sys.stdin); assert c["services"]["app"]["environment"]["AUTH_TOKEN"] == ""'
      - name: First-boot token provisioning and persistence
        run: node --test tests/scripts/docker-auth.test.cjs
      - name: NAS Compose keeps auth in a Docker-managed volume
        run: |
          docker compose config --format json | python3 -c 'import json,sys; c=json.load(sys.stdin); s=c["services"]["app"]; assert s["environment"]["MGO_AUTH_DIR"] == "/mgo-auth"; assert any(m["target"] == "/mgo-auth" and m["type"] == "volume" for m in s["volumes"]); assert s["environment"]["SYMBIAN_AGENT_TOKEN_FILE"] == "/symbian-auth/agent-token"; y=c["services"]["mgo-symbian"]; assert y["environment"]["AGENT_TOKEN_FILE"] == "/symbian-auth/agent-token"; assert set(y["networks"]) == {"symbian"}; assert c["networks"]["symbian"]["internal"] is True'
      - name: NAS style - a folder owned by another user (PUID/PGID), restart keeps the data
        run: |
          docker compose down -v
          sudo mkdir -p /srv/mgo-nas/data && sudo chown 1026:100 /srv/mgo-nas/data
          export MGO_DATA=/srv/mgo-nas/data PUID=1026 PGID=100
          docker compose up -d --no-build app gateway
          for i in $(seq 1 60); do docker compose cp gateway:/certs/server.crt work/ci-ca.crt && break; sleep 1; done
          for i in $(seq 1 60); do curl -fsS https://localhost:8443/api/health | grep -q '"ok":true' && break; sleep 2; done
          curl -fsS https://localhost:8443/api/health | grep -q '"ok":true'
          curl -fsS -H 'Authorization: Bearer ci-token-0123456789abcdef' -F "jar=@tests/fixtures/testmidlet/build/kemtest.jar" https://localhost:8443/api/games | grep -q '"game"'
          docker compose exec -T app sh -c 'test "$(id -u)" = 1026'
          docker compose restart app
          for i in $(seq 1 60); do curl -fsS https://localhost:8443/api/health | grep -q '"ok":true' && break; sleep 2; done
          test "$(curl -fsS -H 'Authorization: Bearer ci-token-0123456789abcdef' https://localhost:8443/api/games | grep -o '"sha256"' | wc -l)" = 1
          sudo test -n "$(sudo ls /srv/mgo-nas/data)"
      - name: Boot without MGO_TOKEN, verify auth and persist after restart
        run: |
          docker compose down -v
          env -u MGO_TOKEN docker compose up -d --no-build app gateway
          for i in $(seq 1 60); do docker compose cp gateway:/certs/server.crt work/ci-ca.crt && break; sleep 1; done
          for i in $(seq 1 60); do curl -fsS https://localhost:8443/api/health | grep -q '"ok":true' && break; sleep 2; done
          secret="$(docker compose exec -T app cat /mgo-auth/.mgo-auth-token)"
          test "${#secret}" -eq 64
          test "$(curl -s -o /dev/null -w '%{http_code}' https://localhost:8443/api/games)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $secret" https://localhost:8443/api/games)" = 200
          docker compose restart app
          for i in $(seq 1 60); do curl -fsS https://localhost:8443/api/health | grep -q '"ok":true' && break; sleep 2; done
          test "$secret" = "$(docker compose exec -T app cat /mgo-auth/.mgo-auth-token)"
      - if: always()
        run: docker compose down -v
