name: LXC (real container)

# The same install scenarios as the `lxc-install` job of CI, but inside a real unprivileged LXC container (LXD): 15-20 minutes, and the
# snap store it needs is flaky. So it is a workflow of its own: it does not slow down CI, and the :edge image does not wait for it.
# It runs on main and on pull requests that touch what the container installs or how it is installed.
on:
  push:
    branches: [main]
    paths: ['ct/**', 'install/**', 'packaging/**', 'tests/lxc/**', 'tools/proxmox/**', 'runtime/**', 'bridge/**', 'apps/api/**', 'package.json', 'package-lock.json', '.github/workflows/lxc.yml']
  pull_request:
    paths: ['ct/**', 'install/**', 'packaging/**', 'tests/lxc/**', 'tools/proxmox/**', 'runtime/**', 'bridge/**', 'apps/api/**', 'package.json', 'package-lock.json', '.github/workflows/lxc.yml']
  workflow_dispatch:

concurrency:
  group: lxc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  KEM_BUILD_INPUTS: runtime/patches runtime/audio runtime/scripts/build-kemulator.sh runtime/scripts/lib.sh

jobs:
  lxc-real:
    name: Same scenarios in a real unprivileged LXC container (LXD, Debian 13 image)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: runtime/build/kemulator
          key: kemulator-${{ hashFiles('runtime/patches/*', 'runtime/audio/**', 'runtime/scripts/build-kemulator.sh', 'runtime/scripts/lib.sh') }}
      - name: Build (KEmulator from the pinned commit + patches, adapter, web, fixtures)
        run: |
          npm ci
          bash runtime/scripts/setup.sh
      - name: LXD
        run: |
          # the snap store resets connections now and then: try again before giving up
          for i in 1 2 3 4; do sudo snap install lxd 2>/dev/null && break || sudo snap refresh lxd 2>/dev/null && break; echo "snap install lxd failed ($i), retrying"; sleep $((i * 20)); done
          sudo lxd waitready
          sudo lxd init --auto
          # Docker on the runner sets the FORWARD policy to DROP, which cuts the LXD bridge off from the internet
          sudo iptables -I DOCKER-USER -j ACCEPT || true
          sudo iptables -I FORWARD -i lxdbr0 -j ACCEPT || true
          sudo iptables -I FORWARD -o lxdbr0 -m state --state RELATED,ESTABLISHED -j ACCEPT || true
          sudo lxc version
      - name: Run the scenarios in an LXC container
        run: sudo -E env "PATH=$PATH" BACKEND=lxd LXC_BIN=lxc tests/lxc/run.sh
      - if: failure()
        run: |
          sudo lxc list || true
          tail -n 60 .lxc-test/fake.log || true
