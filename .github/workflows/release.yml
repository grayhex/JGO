name: Release

# Publishing a GitHub Release starts the release archive and GHCR Docker-image builds.
# Actions -> Run workflow: leave release_tag empty for a build-only check; supply an
# EXISTING Release tag to publish/re-publish assets and images for that tag.
# Beta images keep the :latest alias while the project is in public beta.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview build version (no publishing if release_tag is empty)'
        type: string
        default: '0.0.0-dev'
      release_tag:
        description: 'Existing published release tag to build and publish (empty = preview only)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Version
        id: v
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}
          PREVIEW_VERSION: ${{ inputs.version || '0.0.0-dev' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            v="${RELEASE_TAG#v}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            v="$PREVIEW_VERSION"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.]+)?$ ]] || { echo "bad version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Lint the Community Scripts files
        run: sudo apt-get install -y --no-install-recommends shellcheck >/dev/null && shellcheck -S warning packaging/bin/jgo packaging/build-release.sh packaging/devscripts/*.sh && packaging/devscripts/lint.sh
      - name: Build (KEmulator from the pinned commit + patches, Bridge supervisor, API, web)
        run: |
          npm ci
          bash runtime/scripts/build-kemulator.sh
          cargo build --release --locked --manifest-path bridge/kemulator-adapter/Cargo.toml
          npm run build
      - name: Check production boundaries
        run: node tests/scripts/production.mjs
      - name: Assemble the release
        run: |
          packaging/build-release.sh "${{ steps.v.outputs.version }}" dist-release
          commit="$(cat runtime/build/kemulator/KEM_COMMIT)"
          git init -q kem-src && git -C kem-src remote add origin https://github.com/shinovon/KEmulator
          git -C kem-src fetch -q --depth 1 origin "$commit" && git -C kem-src checkout -q FETCH_HEAD
          git -C kem-src archive --prefix="kemulator-$commit/" -o "dist-release/jgo-kemulator-source-$commit.tar.gz" HEAD
          cp compose.yaml compose.egress.yaml dist-release/
          cp .env.example dist-release/env.example   # GitHub renames release assets that start with a dot
          (cd dist-release && sha256sum jgo-kemulator-source-*.tar.gz compose.yaml compose.egress.yaml env.example >> SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: jgo-${{ steps.v.outputs.version }}
          path: dist-release/*
      - name: Attach assets to the existing GitHub Release
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist-release/* --clobber

  docker:
    name: Build and publish the Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
      - name: Version and tags
        id: v
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}
          PREVIEW_VERSION: ${{ inputs.version || '0.0.0-dev' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            v="${RELEASE_TAG#v}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            v="$PREVIEW_VERSION"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.]+)?$ ]] || { echo "bad version: $v"; exit 1; }
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          tags_app="ghcr.io/$owner/jgo:$v"; tags_gw="ghcr.io/$owner/jgo-gateway:$v"
          case "$v" in *-alpha*|*-rc*|*-dev*) ;; *) tags_app="$tags_app,ghcr.io/$owner/jgo:latest"; tags_gw="$tags_gw,ghcr.io/$owner/jgo-gateway:latest";; esac
          { echo "version=$v"; echo "app=$tags_app"; echo "gateway=$tags_gw"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: steps.v.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: JGO image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          build-args: |
            JGO_VERSION=${{ steps.v.outputs.version }}
          push: ${{ steps.v.outputs.publish == 'true' }}
          tags: ${{ steps.v.outputs.app }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          target: gateway
          push: ${{ steps.v.outputs.publish == 'true' }}
          tags: ${{ steps.v.outputs.gateway }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
