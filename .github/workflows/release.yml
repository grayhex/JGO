name: Release

# Docker is the main way to run JGO, Proxmox VE (LXC) the additional one. A pushed tag v<version> publishes:
#   * the images ghcr.io/grayhex/jgo:<version> and ghcr.io/grayhex/jgo-gateway:<version> (":latest" too for a normal
#     or beta release), built from runtime/Dockerfile;
#   * a GitHub release with compose.yaml, env.example (= .env.example), compose.egress.yaml and the files the Proxmox installer and
#     `jgo update` deploy: jgo-<version>-linux-amd64.tar.gz, SHA256SUMS, jgo-kemulator-source-<commit>.tar.gz.
# Only -alpha / -rc / -dev tags are marked pre-release (the Community Scripts update check ignores those); a
# -beta tag is a normal release so that `latest` points at it. Run by hand (workflow_dispatch) it builds the
# artifacts and the images but pushes nothing, which is how to look at a release before tagging.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (default: 0.0.0-dev)'
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.]+)?$ ]] || { echo "bad version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Lint the Community Scripts files
        run: sudo apt-get install -y --no-install-recommends shellcheck >/dev/null && shellcheck -S warning packaging/bin/jgo packaging/build-release.sh packaging/devscripts/*.sh && packaging/devscripts/lint.sh
      - name: Build (KEmulator from the pinned commit + patches, Bridge supervisor, API, web)
        run: |
          npm ci
          bash runtime/scripts/build-kemulator.sh
          cargo build --release --locked --manifest-path bridge/kemulator-adapter/Cargo.toml
          npm run build
      - name: Check production boundaries
        run: node tests/scripts/production.mjs
      - name: Assemble the release
        run: |
          packaging/build-release.sh "${{ steps.v.outputs.version }}" dist-release
          commit="$(cat runtime/build/kemulator/KEM_COMMIT)"
          git init -q kem-src && git -C kem-src remote add origin https://github.com/shinovon/KEmulator
          git -C kem-src fetch -q --depth 1 origin "$commit" && git -C kem-src checkout -q FETCH_HEAD
          git -C kem-src archive --prefix="kemulator-$commit/" -o "dist-release/jgo-kemulator-source-$commit.tar.gz" HEAD
          cp compose.yaml compose.egress.yaml dist-release/
          cp .env.example dist-release/env.example   # GitHub renames release assets that start with a dot
          (cd dist-release && sha256sum jgo-kemulator-source-*.tar.gz compose.yaml compose.egress.yaml env.example >> SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: jgo-${{ steps.v.outputs.version }}
          path: dist-release/*
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "${{ steps.v.outputs.version }}" in *-alpha*|*-rc*|*-dev*) pre="--prerelease";; esac
          v="${{ steps.v.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" dist-release/* $pre --verify-tag --title "JGO $v" \
            --notes "**Docker (recommended; NAS, Linux):** download compose.yaml and env.example from this release (save it as .env), set JGO_TOKEN, run \`docker compose up -d\`. Image: \`ghcr.io/grayhex/jgo:$v\`. Guide: docs/DOCKER.md.

          **Proxmox VE (additional):** see docs/PROXMOX.md. Update inside the container: \`jgo update\`.

          KEmulator (GPL/Apache/EPL) is built from the pinned upstream commit plus the patches in share/source/; the matching upstream tree is the asset jgo-kemulator-source-*.tar.gz."

  docker:
    name: Build and publish the Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version and tags
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.]+)?$ ]] || { echo "bad version: $v"; exit 1; }
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          tags_app="ghcr.io/$owner/jgo:$v"; tags_gw="ghcr.io/$owner/jgo-gateway:$v"
          case "$v" in *-alpha*|*-rc*|*-dev*) ;; *) tags_app="$tags_app,ghcr.io/$owner/jgo:latest"; tags_gw="$tags_gw,ghcr.io/$owner/jgo-gateway:latest";; esac
          { echo "version=$v"; echo "app=$tags_app"; echo "gateway=$tags_gw"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: JGO image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          build-args: |
            JGO_VERSION=${{ steps.v.outputs.version }}
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.v.outputs.app }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          target: gateway
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.v.outputs.gateway }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
