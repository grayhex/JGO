
# Metadata access only: never a general-purpose forward proxy. Not published.
server {
  listen 9090;
  server_name _;
  resolver 127.0.0.11 valid=60s ipv6=off;
  location ~ ^/(n-gage-games/original/(item/[a-z0-9-]+\.php)?|images/ngage/[a-zA-Z0-9_./-]+)$ {
    limit_except GET { deny all; }
    set $aas_host allaboutsymbian.com;
    proxy_pass https://$aas_host;
    proxy_ssl_name allaboutsymbian.com;
    proxy_set_header Host allaboutsymbian.com;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
  }
  location / { return 404; }
}
