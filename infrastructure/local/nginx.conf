# Front gateway: the only container with a published port. The app container sits on an
# `internal` Docker network (no route to the internet), so a MIDlet cannot call out.
#
# Request size limits. nginx only has to be a bit more generous than the app: the app (MAX_UPLOAD_MB, MAX_SYMBIAN_PACKAGE_MB,
# MAX_FIRMWARE_MB) and the Symbian service enforce the real limits WHILE they stream, and answer 413 themselves.
#   /                          40m   JSON, small files (JAR upload goes through /api/games, see below)
#   /api/games                 1g    JAR/JAD (the app caps them at 32 MB) and Symbian/N-Gage packages (app default 512 MB)
#   /api/symbian/firmware      4g    one firmware file per request (app default cap 2 GB)
# The big ones are streamed (proxy_request_buffering off): nothing is spooled into the gateway's tmpfs, so a 2 GB firmware
# neither needs 2 GB of RAM here nor hits "no space left" in /var/cache/nginx. If you raise MAX_FIRMWARE_MB above 4096 or
# MAX_SYMBIAN_PACKAGE_MB above 1024, raise these two numbers as well (docs/SYMBIAN.md, "Upload limits").
server {
  listen 8080;
  server_name _;
  client_max_body_size 40m;
  server_tokens off;

  location = /api/games {
    client_max_body_size 1g;
    proxy_request_buffering off;
    client_body_timeout 600s;
    include /etc/nginx/jgo-proxy.conf;
  }
  location = /api/symbian/firmware {
    client_max_body_size 4g;
    proxy_request_buffering off;
    client_body_timeout 600s;
    include /etc/nginx/jgo-proxy.conf;
  }
  location = /api/symbian/upload-probe {
    client_max_body_size 4g;
    proxy_request_buffering off;
    client_body_timeout 600s;
    include /etc/nginx/jgo-proxy.conf;
  }
  location / {
    include /etc/nginx/jgo-proxy.conf;
  }
}
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
